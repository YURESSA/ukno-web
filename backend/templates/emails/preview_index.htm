<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Предпросмотр писем · 5 этаж</title>
  <style>
    body { margin:0; padding:32px; background:#f3f0eb; color:#252521; font:16px/1.5 Arial,sans-serif; }
    main { max-width:1200px; margin:auto; }
    h1 { font-size:32px; margin:0 0 8px; }
    header p { color:#66615b; }
    nav { display:flex; flex-wrap:wrap; gap:12px; margin:24px 0; }
    a { color:#b73b15; }
    section { margin:40px 0; }
    .previews { display:flex; flex-wrap:wrap; gap:20px; align-items:flex-start; }
    figure { margin:0; max-width:100%; }
    figcaption { margin-bottom:8px; color:#66615b; }
    iframe { display:block; width:680px; max-width:100%; height:1000px; border:1px solid #d9d3c9; background:white; }
    .mobile iframe { width:375px; }
    @media(max-width:600px) { body { padding:16px; } }
  </style>
</head>
<body><main>
  <header><h1>Письма · 5 этаж</h1><p>Демонстрационные данные. Письма не отправляются. Измените шаблоны и повторите команду генерации.</p></header>
  <nav>{% for item in items %}<a href="#{{ item.name }}">{{ item.subject }}</a>{% endfor %}</nav>
  {% for item in items %}
  <section id="{{ item.name }}">
    <h2>{{ item.subject }}</h2>
    <p><a href="{{ item.name }}.htm" target="_blank" rel="noopener">Открыть HTML</a></p>
    <details><summary>Текстовая версия</summary><pre style="white-space:pre-wrap;">{{ item.text }}</pre></details>
    <div class="previews">
      <figure><figcaption>Широкий экран</figcaption><iframe title="{{ item.name }} — широкий экран" src="{{ item.name }}.htm" sandbox></iframe></figure>
      <figure class="mobile"><figcaption>Мобильный экран · 375 px</figcaption><iframe title="{{ item.name }} — мобильный экран" src="{{ item.name }}.htm" sandbox></iframe></figure>
    </div>
  </section>
  {% endfor %}
</main></body>
</html>
