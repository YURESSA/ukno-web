name: Deploy main-timeweb

on:
  push:
    branches:
      - main-timeweb
  workflow_dispatch:

concurrency:
  group: production-main-timeweb
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: security_test
          POSTGRES_PASSWORD: security_test_password
          POSTGRES_DB: ukno_security_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U security_test -d ukno_security_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend test dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Run backend and concurrency security tests
        env:
          SECURITY_TEST_DATABASE_URL: postgresql+psycopg2://security_test:security_test_password@127.0.0.1:5432/ukno_security_test
        run: python -m pytest -q

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          tags: ukno-backend:${{ github.sha }}
          outputs: type=docker,dest=${{ runner.temp }}/backend.tar
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          tags: ukno-frontend:${{ github.sha }}
          outputs: type=docker,dest=${{ runner.temp }}/frontend.tar
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Compress deployment images
        run: |
          mkdir deployment
          gzip -c "${RUNNER_TEMP}/backend.tar" > deployment/backend.tar.gz
          gzip -c "${RUNNER_TEMP}/frontend.tar" > deployment/frontend.tar.gz

      - name: Upload images to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "deployment/backend.tar.gz,deployment/frontend.tar.gz"
          target: /tmp/ukno-deploy
          rm: true

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script_stop: true
          script: |
            set -eu
            cd "${{ secrets.PROJECT_PATH }}"
            git fetch origin main-timeweb
            git checkout main-timeweb
            git reset --hard origin/main-timeweb
            gzip -dc /tmp/ukno-deploy/deployment/backend.tar.gz | docker load
            gzip -dc /tmp/ukno-deploy/deployment/frontend.tar.gz | docker load
            IMAGE_TAG=${{ github.sha }} docker compose -f infra/docker-compose.prod.yml up -d --no-build --remove-orphans
            IMAGE_TAG=${{ github.sha }} docker compose -f infra/docker-compose.prod.yml ps
            for attempt in $(seq 1 30); do
              if curl --fail --silent --show-error --resolve 5buro.ru:443:127.0.0.1 https://5buro.ru/ >/dev/null; then
                exit 0
              fi
              sleep 2
            done
            docker compose -f infra/docker-compose.prod.yml logs --tail=100
            exit 1

      - name: Remove transferred images
        if: always()
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            rm -rf /tmp/ukno-deploy
            docker image prune -f
