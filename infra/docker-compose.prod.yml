services:
  backend:
    image: ukno-backend:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file:
      - ../.env
      - ../.env.timeweb.local
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/', timeout=5)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  nginx:
    image: ukno-frontend:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
    command: >-
      /bin/sh -c 'while :; do sleep 6h; nginx -s reload; done &
      exec nginx -g "daemon off;"'
    depends_on:
      backend:
        condition: service_healthy

  certbot:
    image: certbot/certbot:v5.8.0
    restart: unless-stopped
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    entrypoint: /bin/sh
    command: >-
      -c 'trap exit TERM; while :; do
      certbot renew --webroot -w /var/www/certbot --quiet;
      sleep 12h & wait $${!};
      done'
    depends_on:
      - nginx
