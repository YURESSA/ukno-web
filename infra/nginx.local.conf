server {
    listen 80 default_server;
    server_name _;
    server_tokens off;
    client_max_body_size 50M;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /api/ {
        proxy_pass http://flask-backend:5000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin-panel/ {
        proxy_pass http://flask-backend:5000/admin-panel/;
    }

    location /login-admin/ {
        proxy_pass http://flask-backend:5000/login-admin/;
    }

    location /static/ {
        proxy_pass http://flask-backend:5000/static/;
    }

    location /media/uploads/ {
        proxy_pass http://flask-backend:5000/media/uploads/;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
